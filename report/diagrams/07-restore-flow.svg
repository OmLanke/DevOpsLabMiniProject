<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Safe database restore workflow</title><desc id="desc">Safe database restore workflow</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#777777"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#111111" font-weight="700"><tspan x="450" dy="0">Safe database restore workflow</tspan></text><rect x="300" y="75" width="300" height="62" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="112.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111"><tspan x="450.0" dy="0">Select and validate backup key</tspan></text><rect x="300" y="165" width="300" height="62" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="202.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111"><tspan x="450.0" dy="0">Confirm restore (or pass --yes)</tspan></text><rect x="300" y="255" width="300" height="62" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="292.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="450.0" dy="0">Remember prior app / worker state</tspan></text><rect x="300" y="345" width="300" height="62" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="382.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111"><tspan x="450.0" dy="0">Stop app and scheduled worker</tspan></text><polygon points="450,435.0 630.0,510 450,585.0 270.0,510" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450" y="504.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111"><tspan x="450" dy="0">Verify manifest, database,</tspan><tspan x="450" dy="25.0">size and SHA-256</tspan></text><rect x="300" y="650" width="300" height="75" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="681.8000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111111"><tspan x="450.0" dy="0">pg_restore in one transaction</tspan><tspan x="450.0" dy="23.75">--exit-on-error</tspan></text><rect x="620" y="430" width="230" height="68" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="735.0" y="470.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="735.0" dy="0">Reject backup; run no SQL</tspan></text><rect x="300" y="790" width="300" height="65" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="817.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="450.0" dy="0">Restart originally running</tspan><tspan x="450.0" dy="22.5">services only</tspan></text><line x1="450" y1="137" x2="450" y2="165" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="227" x2="450" y2="255" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="317" x2="450" y2="345" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="407" x2="450" y2="435" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="585" x2="450" y2="650" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><path d="M630,510 L870,510 L870,420 L735,420 L735,430" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="655" y="535" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="655" dy="0">invalid</tspan></text><path d="M735,498 L735,822 L600,822" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="635" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="755" dy="0">restart</tspan></text><text x="466" y="622" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="466" dy="0">valid</tspan></text><line x1="450" y1="725" x2="450" y2="790" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444"><tspan x="450" dy="0">Wrapper restores prior service state after success or failure.</tspan></text></svg>
