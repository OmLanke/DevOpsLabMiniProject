<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Notes API endpoints</title><desc id="desc">Notes API endpoints</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#777777"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#111111" font-weight="700"><tspan x="450" dy="0">Notes API endpoints</tspan></text><rect x="350" y="78" width="200" height="58" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="114.82" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#111111" font-weight="700"><tspan x="450.0" dy="0">Express API</tspan></text><line x1="450" y1="136" x2="450" y2="195" stroke="#777777" stroke-width="2"/><line x1="110" y1="195" x2="820" y2="195" stroke="#777777" stroke-width="2"/><line x1="95" y1="195" x2="95" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="95.0" y="294.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="95.0" dy="0">GET /health</tspan><tspan x="95.0" dy="21.25">DB readiness</tspan></text><line x1="237" y1="195" x2="237" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="177" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="237.0" y="294.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="237.0" dy="0">GET /notes</tspan><tspan x="237.0" dy="21.25">List notes</tspan></text><line x1="379" y1="195" x2="379" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="319" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="379.0" y="294.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="379.0" dy="0">POST /notes</tspan><tspan x="379.0" dy="21.25">Create note</tspan></text><line x1="521" y1="195" x2="521" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="461" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="521.0" y="294.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="521.0" dy="0">GET /notes/:id</tspan><tspan x="521.0" dy="21.25">Read one</tspan></text><line x1="663" y1="195" x2="663" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="603" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="663.0" y="294.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="663.0" dy="0">PUT /notes/:id</tspan><tspan x="663.0" dy="21.25">Replace fields</tspan></text><line x1="805" y1="195" x2="805" y2="250" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="745" y="250" width="120" height="100" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="805.0" y="284.02" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="805.0" dy="0">DELETE</tspan><tspan x="805.0" dy="21.25">/notes/:id</tspan><tspan x="805.0" dy="21.25">Remove note</tspan></text><text x="450" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444"><tspan x="450" dy="0">Database routes use parameterized SQL; invalid IDs and inputs receive client errors.</tspan></text><text x="450" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444"><tspan x="450" dy="0">JSON request bodies are limited to 32 KB.</tspan></text></svg>
