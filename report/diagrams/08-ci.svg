<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Continuous integration and scheduled recovery</title><desc id="desc">Continuous integration and scheduled recovery</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#777777"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#111111" font-weight="700"><tspan x="450" dy="0">Continuous integration and scheduled recovery</tspan></text><rect x="345" y="75" width="210" height="68" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="116.48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111111" font-weight="700"><tspan x="450.0" dy="0">Push / pull request</tspan></text><line x1="450" y1="143" x2="450" y2="185" stroke="#777777" stroke-width="2"/><line x1="210" y1="185" x2="690" y2="185" stroke="#777777" stroke-width="2"/><line x1="210" y1="185" x2="210" y2="220" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="690" y1="185" x2="690" y2="220" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="220" width="330" height="215" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="45" y="220" width="330" height="48" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="210.0" y="251.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#111111" font-weight="700"><tspan x="210.0" dy="0">Application job</tspan></text><text x="210" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="210" dy="0">Node syntax check</tspan><tspan x="210" dy="22.5">Express API tests</tspan><tspan x="210" dy="22.5">Python backup / wrapper</tspan><tspan x="210" dy="22.5">unit tests</tspan></text><rect x="525" y="220" width="330" height="215" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="525" y="220" width="330" height="48" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="690.0" y="251.14" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#111111" font-weight="700"><tspan x="690.0" dy="0">Containers and recovery job</tspan></text><text x="690" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="690" dy="0">Compose validation</tspan><tspan x="690" dy="22.5">Build app, backup, and MinIO</tspan><tspan x="690" dy="22.5">Run isolated integration recovery</tspan><tspan x="690" dy="22.5">Upload recovery logs artifact</tspan></text><rect x="145" y="485" width="610" height="90" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="450" dy="0">Separate scheduled workflow: daily at 03:17 UTC or manual start.</tspan><tspan x="450" dy="22.5">Runs the disposable recovery demonstration in a temporary environment.</tspan></text></svg>
