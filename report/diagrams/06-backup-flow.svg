<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Scheduled backup workflow</title><desc id="desc">Scheduled backup workflow</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#777777"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#111111" font-weight="700"><tspan x="450" dy="0">Scheduled backup workflow</tspan></text><rect x="25" y="150" width="142" height="105" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="25" y="150" width="142" height="40" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="96.0" y="176.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="96.0" dy="0">pg_dump</tspan></text><text x="96" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="96" dy="0">custom format</tspan><tspan x="96" dy="20.0">compressed</tspan></text><rect x="202" y="150" width="142" height="105" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="202" y="150" width="142" height="40" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="273.0" y="176.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="273.0" dy="0">SHA-256</tspan></text><text x="273" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="273" dy="0">hash archive</tspan><tspan x="273" dy="20.0">record byte size</tspan></text><rect x="379" y="150" width="142" height="105" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="379" y="150" width="142" height="40" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="176.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="450.0" dy="0">Upload dump</tspan></text><text x="450" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="450" dy="0">unique UTC key</tspan><tspan x="450" dy="20.0">with UUID</tspan></text><rect x="556" y="150" width=