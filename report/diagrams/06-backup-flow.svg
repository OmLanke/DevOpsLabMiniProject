serif" font-size="18" fill="#111111"><tspan x="781.0" dy="0">Delete incomplete</tspan><tspan x="781.0" dy="22.5">dump object</tspan></text><path d="M627,255 L627,325 L552,325 L552,390" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><line x1="662" y1="429" x2="692" y2="429" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444"><tspan x="450" dy="0">Worker attempts immediately, then waits the configured interval after each attempt.</tspan></text></svg>
