<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 900 1150" role="img" aria-labelledby="title desc">
<title id="title">End-to-end recovery sequence</title><desc id="desc">End-to-end recovery sequence</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#777777"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#111111" font-weight="700"><tspan x="450" dy="0">End-to-end recovery sequence</tspan></text><rect x="24" y="70" width="132" height="55" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="90.0" y="103.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="90.0" dy="0">Client</tspan></text><line x1="90" y1="125" x2="90" y2="1080" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="6 6"/><rect x="204" y="70" width="132" height="55" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="270.0" y="103.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="270.0" dy="0">Express API</tspan></text><line x1="270" y1="125" x2="270" y2="1080" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="6 6"/><rect x="384" y="70" width="132" height="55" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="450.0" y="103.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="450.0" dy="0">PostgreSQL</tspan></text><line x1="450" y1="125" x2="450" y2="1080" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="6 6"/><rect x="564" y="70" width="132" height="55" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="630.0" y="103.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="630.0" dy="0">Backup worker</tspan></text><line x1="630" y1="125" x2="630" y2="1080" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="6 6"/><rect x="744" y="70" width="132" height="55" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="810.0" y="103.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111" font-weight="700"><tspan x="810.0" dy="0">MinIO</tspan></text><line x1="810" y1="125" x2="810" y2="1080" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="6 6"/><line x1="90" y1="175" x2="270" y2="175" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">POST /notes</tspan></text><line x1="270" y1="220" x2="450" y2="220" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">INSERT note</tspan></text><line x1="450" y1="265" x2="270" y2="265" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">created row</tspan></text><line x1="270" y1="310" x2="90" y2="310" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">201 response</tspan></text><line x1="630" y1="385" x2="450" y2="385" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="540.0" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="540.0" dy="0">pg_dump archive</tspan></text><line x1="630" y1="435" x2="810" y2="435" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="720.0" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="720.0" dy="0">upload dump</tspan></text><line x1="630" y1="485" x2="810" y2="485" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="720.0" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="720.0" dy="0">upload manifest</tspan></text><line x1="90" y1="550" x2="630" y2="550" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">select backup key</tspan></text><line x1="90" y1="600" x2="270" y2="600" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">stop app</tspan></text><line x1="90" y1="635" x2="630" y2="635" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">stop worker</tspan></text><line x1="90" y1="670" x2="450" y2="670" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="270.0" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="270.0" dy="0">remove isolated PG volume</tspan></text><line x1="90" y1="705" x2="450" y2="705" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="270.0" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="270.0" dy="0">recreate PG volume</tspan></text><line x1="630" y1="750" x2="810" y2="750" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="720.0" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="720.0" dy="0">download objects</tspan></text><path d="M630,785 L662,785 L662,798 L630,798" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="790" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="675" dy="0">verify manifest</tspan></text><path d="M630,810 L662,810 L662,823 L630,823" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="815" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="#111111"><tspan x="675" dy="0">check size + SHA-256</tspan></text><line x1="630" y1="850" x2="450" y2="850" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="540.0" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="540.0" dy="0">transactional restore</tspan></text><line x1="90" y1="895" x2="270" y2="895" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">restart app</tspan></text><line x1="90" y1="935" x2="270" y2="935" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">GET /notes</tspan></text><line x1="270" y1="975" x2="450" y2="975" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="965" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">SELECT notes</tspan></text><line x1="450" y1="1015" x2="270" y2="1015" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="1005" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="360.0" dy="0">recovered rows</tspan></text><line x1="270" y1="1055" x2="90" y2="1055" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="1045" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111111"><tspan x="180.0" dy="0">compare exact snapshot</tspan></text><text x="450" y="1120" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#444444"><tspan x="450" dy="0">MinIO volume remains; recovered rows are compared with the saved snapshot.</tspan></text></svg>
