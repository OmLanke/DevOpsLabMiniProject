="url(#arrow)"/><text x="424" y="230" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#111111"><tspan x="424" dy="0">logical dump</tspan></text><line x1="500" y1="299" x2="625" y2="295" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="561" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#111111"><tspan x="561" dy="0">dump + JSON</tspan></text><line x1="727" y1="345" x2="727" y2="390" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><path d="M625,298 L570,298 L570,458 L500,458" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#111111"><tspan x="565" dy="0">selected backup</tspan></text><path d="M315,458 L278,458 L278,149 L315,149" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#arrow)"/><text x="259" y="385" text-anchor="start" font-family="Arial, sans-serif" font-size="15" fill="#111111"><tspan x="259" dy="0">restore</tspan></text><path d="M500,149 L560,149 L560,150 L625,150" fill="none" stroke="#777777" stroke-width="2"/><text x="450" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#444444"><tspan x="450" dy="0">Separate volumes preserve database files and backup objects across container recreation.</tspan></text></svg>
