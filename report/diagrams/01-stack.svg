span></text><rect x="566" y="145" width="150" height="190" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="566" y="145" width="150" height="47" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="641.0" y="175.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111" font-weight="700"><tspan x="641.0" dy="0">Object storage</tspan></text><text x="641" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="641" dy="0">MinIO</tspan><tspan x="641" dy="22.5">S3-compatible</tspan><tspan x="641" dy="22.5">object API</tspan></text><rect x="743" y="145" width="150" height="190" rx="5" fill="#ffffff" stroke="#777777" stroke-width="2"/><rect x="743" y="145" width="150" height="47" rx="5" fill="#f2f2f2" stroke="#777777" stroke-width="2"/><text x="818.0" y="175.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111111" font-weight="700"><tspan x="818.0" dy="0">Automation</tspan></text><text x="818" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111111"><tspan x="818" dy="0">Docker Compose</tspan><tspan x="818" dy="22.5">GitHub Actions</tspan></text><text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#444444"><tspan x="450" dy="0">Local services use health checks and persistent Docker volumes.</tspan></text><text x="450" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#444444"><tspan x="450" dy="0">CI runs unit checks, image builds, and a disposable recovery exercise.</tspan></text></svg>
